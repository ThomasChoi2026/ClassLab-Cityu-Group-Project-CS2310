name: ClassLab safe coursework demo acceptance

on:
  push:
    branches:
      - feature/coursework-safe-run-demo-20261124
  pull_request:
    paths:
      - 'demo/**'
      - 'examples/CS2310_ClassLab_Demo_Lecture.ipynb'
      - 'tests/demo_workflow.py'
      - 'tests/browser_demo.py'
      - 'web/app.js'
      - 'web/teacher.html'
      - 'src/main.cpp'
      - 'src/judge_client.hpp'
      - '.github/workflows/coursework-demo.yml'

permissions:
  contents: read

jobs:
  demo-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build ClassLab C++20 and verify JavaScript
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          node --check web/app.js
      - name: Run full CTest suite (includes fixed demo isolation)
        run: ctest --test-dir build --output-on-failure
      - name: Install isolated browser test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install playwright pillow zxing-cpp
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Test coursework demo in real Chromium (fixture playback, no arbitrary C++)
        run: |
          python3 demo/run.py --binary ./build/classlab --port 18082 >"$RUNNER_TEMP/coursework-demo.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18082/api/health >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:18082/demo-lecture.ipynb >"$RUNNER_TEMP/lecture.ipynb"
          .venv/bin/python -m json.tool "$RUNNER_TEMP/lecture.ipynb" >/dev/null
          .venv/bin/python tests/browser_demo.py http://127.0.0.1:18082
