name: ClassLab teacher UX verification

on:
  pull_request:
    paths:
      - 'web/**'
      - 'tests/browser_teacher_ux.py'
      - 'tests/browser_classroom_export.py'
      - 'tests/browser_run_output.py'
      - 'tests/browser_demo.py'
      - '.github/workflows/teacher-ux.yml'

permissions:
  contents: read

jobs:
  teacher-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build C++20 server
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Check JavaScript syntax
        run: node --check web/app.js
      - name: Install Chromium browser test
        run: |
          python3 -m venv .venv
          .venv/bin/pip install playwright
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Teacher quick practice and Notebook integration
        run: |
          CLASSLAB_HOST=127.0.0.1 CLASSLAB_PORT=18081 CLASSLAB_DATA="$RUNNER_TEMP/classlab-teacher.json" ./build/classlab >"$RUNNER_TEMP/teacher-server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:18081/api/health >/dev/null 2>&1; then break; fi
            sleep 0.2
          done
          .venv/bin/python tests/browser_teacher_ux.py http://127.0.0.1:18081
          .venv/bin/python tests/browser_classroom_export.py http://127.0.0.1:18081
          .venv/bin/python tests/browser_run_output.py http://127.0.0.1:18081
