name: ClassLab Notebook classroom integration acceptance

on:
  push:
    branches: [main, release/sandbox-only, experiment/trusted-native-compile, fix/sandbox-interactive-stdin, fix/native-interactive-stdin]
  pull_request:
    paths:
      - 'web/**'
      - 'src/**'
      - 'examples/**'
      - 'demo/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/notebook-classroom.yml'

permissions:
  contents: read

jobs:
  classroom-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: C++20 build and JavaScript syntax
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          node --check web/app.js
          node --check web/notebook.js
      - name: Full CTest including all original tests, marker parser and lecture compilation
        run: |
          ctest --test-dir build --output-on-failure
          ctest --test-dir build -R 'notebook_markers|score_lecture_cpp20' --verbose
      - name: Install browser dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install playwright pillow zxing-cpp
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Actual Chromium plus GCC persistent stdin
        run: .venv/bin/python tests/browser_interactive_native.py ./build/classlab
      - name: Student, teacher, native Run-first and consecutive Notebook publication regressions
        run: |
          CLASSLAB_HOST=127.0.0.1 CLASSLAB_PORT=18080 CLASSLAB_DATA="$RUNNER_TEMP/notebook-normal.json" ./build/classlab >"$RUNNER_TEMP/normal.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/api/health >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          .venv/bin/python tests/browser_student.py http://127.0.0.1:18080
          .venv/bin/python tests/browser_teacher_ux.py http://127.0.0.1:18080
          .venv/bin/python tests/browser_notebook_publish.py http://127.0.0.1:18080 --evidence notebook-evidence
          .venv/bin/python tests/browser_classroom_records.py http://127.0.0.1:18080
          .venv/bin/python tests/browser_notebook_classroom.py http://127.0.0.1:18080 --evidence-dir notebook-evidence
          .venv/bin/python tests/browser_run_first.py ./build/classlab
          .venv/bin/python tests/browser_classroom_export.py http://127.0.0.1:18080
          .venv/bin/python tests/browser_run_output.py http://127.0.0.1:18080
      - name: Upload accepted classroom screenshots
        uses: actions/upload-artifact@v4
        with:
          name: classlab-notebook-classroom-evidence
          path: notebook-evidence/*.png
          if-no-files-found: error
