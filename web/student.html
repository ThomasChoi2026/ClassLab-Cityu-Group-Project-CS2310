<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClassLab · 学生课堂</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body data-view="student">
  <header class="top"><div><strong>ClassLab</strong><span>学生课堂</span></div></header>
  <div id="demo-banner" class="demo-banner" role="status" hidden>预置演示结果 · 加入和提交实时记录 · 评测仅回放固定夹具</div>
  <main class="student">
    <section id="setup" class="intro">
      <div><h1>加入编程课堂</h1><p>输入昵称，让教师认出你的提交。</p></div>
      <div class="panel">
        <form id="join">
          <label>你的昵称<input name="name" required maxlength="40" autocomplete="nickname"></label>
          <button>加入课堂</button>
        </form>
      </div>
    </section>
    <section id="workspace" hidden>
      <div class="heading"><div><h1 id="room-name"></h1><p id="student-name"></p></div></div>
      <p id="connection" role="status" class="feedback error"></p>
      <section class="panel">
        <p id="waiting">等待教师发布任务，页面将自动更新。</p>
        <div id="assignment" hidden>
          <h2 id="task-title"></h2>
          <p id="task-description" class="description"></p>
          <details id="public-tests" hidden>
            <summary>公开测试用例</summary>
            <div id="student-public-tests"></div>
          </details>
          <form id="submit">
            <div class="editor-field">
              <div class="section-heading">
                <label for="student-code">你的 C++ 代码</label>
                <button id="copy-code" type="button" class="secondary">复制代码</button>
              </div>
              <textarea id="student-code" class="editor" name="code" required rows="14" maxlength="20000" wrap="off" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off"></textarea>
              <p id="editor-feedback" class="inline-status" role="status"></p>
            </div>
            <fieldset id="run-controls" class="run-controls" disabled aria-describedby="run-state">
              <legend>自由运行</legend>
              <label>自定义标准输入<textarea name="runInput" rows="2" maxlength="2700"></textarea></label>
              <button id="run-code" type="button" class="secondary">运行代码</button>
            </fieldset>
            <p id="run-state" role="status">隔离执行器不可用，暂时无法运行代码。</p>
            <section id="run-result" aria-label="自由运行结果" hidden></section>
            <button type="submit" aria-keyshortcuts="Control+Enter Meta+Enter">提交代码</button>
            <small>在编辑器中按 Ctrl + Enter 或 ⌘ + Enter 也可提交。</small>
            <p id="submit-feedback" role="status" class="feedback"></p>
          </form>
          <section id="latest-result" hidden>
            <h3>最新正式提交</h3>
            <div id="student-result"></div>
          </section>
        </div>
      </section>
    </section>
    <p id="feedback" role="status" class="feedback"></p>
  </main>
</body>
</html>
